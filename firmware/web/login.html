<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login</title>
	<link rel="stylesheet" href="./axcss.css">
	<link rel="stylesheet" href="./themes/active.css">
	<style>
		#content {
			display: flex; align-items: center; justify-content: center;
			padding: 24px;
		}
		.login {
			display: flex; flex-direction: column; gap: 14px;
			width: 100%; max-width: 400px;
			padding: 40px 36px 28px;
			background: var(--surface); border: 1px solid var(--line);
			border-radius: var(--radius);
			box-shadow: 0 16px 40px rgba(0, 0, 0, .28);
		}
		.login-kicker {
			font-size: 12px; font-weight: 650; letter-spacing: .14em;
			text-transform: uppercase; color: var(--accent);
		}
		.login-txt {
			font-size: 34px; font-weight: 650; letter-spacing: -.03em; line-height: 1.1;
		}
		.login-sub { margin-top: -6px; color: var(--muted); font-size: 15px; }
		.login .input { max-width: none; }
		.login .common-btn { width: 100%; margin-top: 6px; }
		#version { font-size: 12px; color: #5d6773; text-align: center; }
	</style>
</head>
<body>
	<div class="wrap">
		<div class="content" id="content">
			<div class="login">
				<div class="login-kicker">HP10</div>
				<h1 class="login-txt">Login</h1>
				<p class="login-sub">Sign in to the camera.</p>
				<input type="text" class="input" value="admin" disabled />
				<input type="password" class="input" id="pwd" maxlength="63" onkeydown="keyDown(event)" />
				<label class="pwd-label"><input type="checkbox" autocomplete="off" onchange="togglePwd(this, 'pwd')">Show password</label>
				<button type="button" class="common-btn" onclick="login()">Login</button>
				<p id="version"></p>
			</div>
		</div>
	</div>
</body>
<script src="./axjs.js"></script>
<script>
	function keyDown(e) { if (e.keyCode === 13) login() }

	function login() {
		let pwd = document.querySelector('#pwd').value
		ajax({
			method: 'post',
			url: '/set_login_info',
			data: { pwd: baseCode(pwd) },
			success: function (res) {
				if (res.status == '1')
					location.href = './status.html'
				else
					toast({ txt: res.msg, type: 'error', time: 10000 })
			},
			error: function (err) { toast({ txt: err, type: 'error' }) }
		})
	}

	ajax({
		url: '/get_version',
		success: function (res) {
			localStorage.setItem('version', res.version)
			document.querySelector('#version').innerHTML = res.version
		}
	})
</script>
</html>
