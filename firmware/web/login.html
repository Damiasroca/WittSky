<!DOCTYPE html>
<html>

	<head>
		<meta charset="utf-8">
		<title>login</title>
		<link rel="stylesheet" href="./axcss.css">
	</head>

	<body>
		<div class="wrap">
			<div class="content login-page" id="content">
				<div class="login">
					<div class="login-kicker">HP10</div>
					<h1 class="login-txt">Login</h1>
					<p class="login-sub">Sign in to the camera.</p>
					<div>
						<input type="text" class="input" id="" value="admin" disabled />
					</div>
					<div class="pwd">
						<div class="pwd-box">
							<input type="password" class="input" id="pwd" maxlength="63" onkeydown="keyDown(event)" />
							<div id="show-pwd" class="iconfont icon-yincang eye" onclick="wifiPwdChange(this)"></div>
						</div>
					</div>
					<button type="button" class="common-btn" onclick="login()">Login</button>
					<p id="version"></p>
				</div>
			</div>
		</div>
	</body>
	<script src="./axjs.js"></script>
	<script>
		function wifiPwdChange(_this) { //是否显示密码
			let wifiPwd = document.querySelector('#pwd')
			if (_this.classList.contains('icon-yincang')) {//不显示类名, 展示密码
				_this.classList.remove('icon-yincang')
				_this.classList.add('icon-xianshimima')
				wifiPwd.type = 'text'
			} else {
				_this.classList.add('icon-yincang')
				_this.classList.remove('icon-xianshimima')
				wifiPwd.type = 'password'
			}
		}
		function keyDown(e) {
			if (e.keyCode === 13) {
				login()
			}
		}
		function login() {
			let pwd = document.querySelector('#pwd').value;
			ajax({
				method: 'post',
				url: '/set_login_info',
				data: {
					pwd: baseCode(pwd)
				},
				success: function (res) {
					if (res.status == '1') {
						location.href = './status.html';
					} else {
						toast({
							txt: res.msg,
							type: 'error',
							time: 10000
						})
					}
				},
				error: function (err) {
					toast({
						txt: err,
						type: 'error'
					})
				}
			})
		}
		getVersion()
		function getVersion() {
			ajax({
				url: '/get_version',
				success: function (res) {
					localStorage.setItem('version', res.version)
					if (res.newVersion == 1)
						localStorage.setItem('newVersion', '1')
					else
						localStorage.removeItem('newVersion')
					let el = document.querySelector('#version')
					el.textContent = res.version || ''
					if (res.newVersion == 1) {
						let note = document.createElement('span')
						note.className = 'ota-note'
						note.textContent = res.msg || 'A new firmware version is available.'
						el.appendChild(document.createElement('br'))
						el.appendChild(note)
					}
				},
				error: function (err) {
					return err
				}
			})
		}
	</script>

</html>
